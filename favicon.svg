<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Brillo del espíritu -->
    <filter id="ghostGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3fd0ff" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#bbf3ff"/>
      <stop offset="100%" stop-color="#55cfff"/>
    </linearGradient>
    <linearGradient id="fortniteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdc40"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fondo sutil circular oscuro -->
  <circle cx="32" cy="32" r="30" fill="#070c22"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="rgba(63, 208, 255, 0.4)" stroke-width="1.5"/>

  <!-- Fantasmita / Espíritu -->
  <g filter="url(#ghostGlow)">
    <!-- Cuerpo del espíritu flotante -->
    <path d="M 32 10
             C 20 10 14 19 14 29
             C 14 36 12 43 11 48
             C 13 49 16 48 18 45
             C 21 48 24 49 27 46
             C 30 49 34 49 37 46
             C 40 49 43 48 46 45
             C 48 48 51 49 53 48
             C 52 43 50 36 50 29
             C 50 19 44 10 32 10 Z"
          fill="url(#ghostGrad)"/>

    <!-- Brazos pequeños etéreos -->
    <path d="M 14 29 C 9 31 8 35 11 37 C 13 36 14 33 15 30 Z" fill="#bbf3ff"/>
    <path d="M 50 29 C 55 31 56 35 53 37 C 51 36 50 33 49 30 Z" fill="#bbf3ff"/>

    <!-- Ojos grandes estilo Fortnite Spirit -->
    <ellipse cx="25" cy="25" rx="3.5" ry="5.2" fill="#04122e"/>
    <ellipse cx="39" cy="25" rx="3.5" ry="5.2" fill="#04122e"/>
    <!-- Brillo en ojos -->
    <circle cx="24" cy="23" r="1.5" fill="#ffffff"/>
    <circle cx="38" cy="23" r="1.5" fill="#ffffff"/>

    <!-- Sonrisa pícara -->
    <path d="M 28 33 Q 32 37 36 33" fill="none" stroke="#04122e" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Mejillas brillantes -->
    <ellipse cx="20" cy="31" rx="2.2" ry="1.4" fill="#3fd0ff" opacity="0.6"/>
    <ellipse cx="44" cy="31" rx="2.2" ry="1.4" fill="#3fd0ff" opacity="0.6"/>

    <!-- Destellito sobre la cabeza -->
    <path d="M 32 4 L 33 7 L 36 8 L 33 9 L 32 12 L 31 9 L 28 8 L 31 7 Z" fill="#ffd070"/>
  </g>

  <!-- Insignia esquina inferior derecha con la F de Fortnite -->
  <g filter="url(#badgeShadow)">
    <!-- Rombo / Escudo hexagonal Fortnite -->
    <path d="M 51 37 L 61 43 L 61 55 L 51 61 L 41 55 L 41 43 Z" fill="#090f2b" stroke="#ffdc40" stroke-width="2"/>
    <path d="M 51 39 L 59 44 L 59 54 L 51 59 L 43 54 L 43 44 Z" fill="url(#fortniteGrad)"/>

    <!-- 'F' estilo Fortnite gruesa, condensada y contundente -->
    <path d="M 47.5 44 L 55.5 44 L 55.5 47 L 51 47 L 51 48.8 L 54.5 48.8 L 54.5 51.5 L 51 51.5 L 51 56 L 47.5 56 Z" fill="#070c22"/>
  </g>
</svg>
